<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dictionnaire IT — Recherche locale</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#0f172a;color:#e2e8f0}input{width:100%;padding:.8rem;font-size:1.1rem;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff}button{padding:.4rem .8rem;margin:.2rem;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;cursor:pointer}button.act{background:#2563eb}.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:1rem;margin:.6rem 0}code{background:#0f172a;padding:.15rem .4rem;border-radius:4px;color:#7dd3fc}.tag{font-size:.75rem;background:#334155;border-radius:4px;padding:.1rem .4rem;margin-right:.3rem}</style></head>
<body>
<h1>📖 Dictionnaire IT — <span id="n">…</span> entrées (offline)</h1>
<input id="q" placeholder="Tape : copier, processus, réseau, permission denied, cpu…">
<div><button data-os="all" class="act">Tous</button><button data-os="linux">Linux</button><button data-os="macos">macOS</button><button data-os="windows-powershell">PowerShell</button><button data-os="windows-cmd">CMD</button></div>
<div id="r"></div>
<script>
let D=[], F="all";
fetch("../data/dictionnaire.json").then(r=>r.json()).then(j=>{D=j.entries;document.getElementById("n").textContent=D.length;go("")});
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{document.querySelectorAll("button").forEach(x=>x.classList.remove("act"));b.classList.add("act");F=b.dataset.os;go(document.getElementById("q").value)});
document.getElementById("q").oninput=e=>go(e.target.value);
function go(q){q=q.toLowerCase();let h=D.filter(e=>(F==="all"||e.os.includes(F))&&(!q||(e.nom+" "+e.role_fr+" "+e.syntaxe+" "+(e.aliases||[]).join(" ")+" "+(e.tags||[]).join(" ")+" "+(e.contextes||[]).join(" ")+" "+(e.subtilites||[]).join(" ")).toLowerCase().includes(q))).slice(0,50);
document.getElementById("r").innerHTML=h.map(e=>{
let s=`<div class="card"><b><code>${e.nom}</code></b> <span class="tag">${e.os_raw}</span><span class="tag">${e.id}</span>${e.niveau&&e.niveau!=="debutant"?`<span class="tag">${e.niveau}</span>`:""}`;
if(e.role_fr)s+=`<br>${e.role_fr}`;
if(e.aliases&&e.aliases.length)s+=`<br><i>${e.aliases.join(" · ")}</i>`;
if(e.contextes&&e.contextes.length)s+=`<br><span class="tag">📍</span>${e.contextes.join(" · ")}`;
if(e.syntaxe)s+=`<br>Syntaxe: <code>${e.syntaxe}</code>`;
if(e.cas_reguliers&&e.cas_reguliers.length)s+=`<br>Cas courants:<ul style="margin:.3rem 0">`+e.cas_reguliers.slice(0,4).map(c=>`<li><code>${c.cmd}</code>${c.explication?" — "+c.explication:""}</li>`).join("")+`</ul>`;
else if(e.exemples&&e.exemples.length)s+=`<br>Ex: ${e.exemples.slice(0,3).map(x=>`<code>${x.cmd}</code>`).join(" · ")}`;
if(e.precautions)s+=`<br>⚠️ ${e.precautions}`;
if(e.urgences_dangers&&e.urgences_dangers!=="—")s+=`<br>${e.urgences_dangers}`;
if(e.subtilites&&e.subtilites.length)s+=`<br><details><summary>🔮 ${e.subtilites.length} subtilité(s)/confusion(s)</summary><ul>`+e.subtilites.map(x=>`<li>${x}</li>`).join("")+`</ul></details>`;
if(e.origine)s+=`<details><summary>📜 Origine</summary>${e.origine}</details>`;
if(e.equivalents&&e.equivalents.length)s+=`<br>↔ ${e.equivalents.map(x=>x.cmd||x.note).join(" · ")}`;
if(e.voir_aussi&&e.voir_aussi.length)s+=`<br>Voir aussi: ${e.voir_aussi.join(", ")}`;
return s+`</div>`}).join("")||"<p>Aucun résultat.</p>"}
</script></body></html>
